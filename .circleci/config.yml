          at: /tmp/alt4
      - run:
          name: Prefetch gate output
          command: |
            cat /tmp/alt4/sha_a468443aaa
      - run:
          name: Prepare source
          command: git clone --quiet --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore artifacts
          command: tar -xf files.tar
