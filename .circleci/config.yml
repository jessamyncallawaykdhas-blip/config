            echo "gate omar-verify: $(wc -c </tmp/alt4/sha_a468443aaa) bytes total"
      - persist_to_workspace:
          root: /tmp/alt4
          paths:
            - 'sha_a468443aaa'
  omar-verify:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
